#version: "3.8"

services:
  localstack:
    image: localstack/localstack-pro:4.0.3
    container_name: localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - LOCALSTACK_API_KEY=${API_KEY}
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:80,http://localhost:4200,http://127.0.0.1:80,http://127.0.0.1:4200
      - DISABLE_CUSTOM_CORS_S3=1
      - DISABLE_CUSTOM_CORS_APIGATEWAY=0
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./shared:/shared"


  angular-app:
    profiles:
      - enable_frontend
    build:
      context: ./angular
    ports:
      - "80:80"
    environment:
      - NODE_ENV=development
    volumes:
      - "./shared:/usr/share/nginx/html/assets/config"
    depends_on:
      - localstack
